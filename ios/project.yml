# مشروع Xcode يُولَّد بأمر واحد:  xcodegen generate
# (التثبيت: brew install xcodegen)
name: Ahsem
options:
  bundleIdPrefix: sa.ahsem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: ar
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # المصادقة والقراءة الخاضعة لـ RLS والبث اللحظي لتصويت المجموعة.
  # نفس مزوّد النسخة الويب (@supabase/supabase-js) بعميله الرسمي لـ Swift.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Ahsem:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Ahsem/Sources
      - path: Ahsem/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ahsem.app
        PRODUCT_NAME: Ahsem
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Ahsem/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
